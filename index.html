<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Fitness Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #101216;
  --surface: #191c21;
  --surface-hi: #21252c;
  --line: #2a2f38;
  --coral: #ff4b3e;
  --coral-dim: #7a2b26;
  --teal: #34c9c0;
  --amber: #ffb648;
  --text: #ece9e2;
  --text-dim: #8b909a;
  --text-faint: #565b64;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:
    radial-gradient(1100px 500px at 15% -10%, #1a2c2c 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 0%, #2a1a1a 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap{ max-width: 1180px; margin: 0 auto; padding: 24px 18px 70px; }

/* ---------- HEADER ---------- */
.header{
  display:flex; justify-content:space-between; align-items:center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px; margin-bottom: 14px;
  gap: 16px; flex-wrap: wrap;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.14em;
  color: var(--text-faint); text-transform:uppercase; margin-bottom:2px;
}
.wordmark{
  font-family:'Oswald', sans-serif; font-size:24px; font-weight:600; line-height:1;
  letter-spacing:0px;
}

.header-right{ display:flex; align-items:center; gap:10px; }

.io-btn{
  background:none; border:1px solid var(--line); color:var(--text-dim);
  font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  padding:7px 12px; border-radius:8px; cursor:pointer;
}
.io-btn:hover{ border-color: var(--teal); color: var(--teal); }

/* ---------- TABS ---------- */
.tab-bar{
  display:inline-flex; gap:3px; margin-bottom:20px;
  background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px;
}
.tab-btn{
  position:relative; background:none; border:none; color:var(--text-dim);
  font-family:'Oswald', sans-serif; font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;
  padding:9px 24px; border-radius:9px; cursor:pointer;
  transition: background .15s ease, color .15s ease;
}
.tab-btn.active{ background: var(--surface-hi); color: var(--text); }
.tab-btn.active::after{
  content:''; position:absolute; left:16px; right:16px; bottom:5px; height:2px;
  background: var(--coral); border-radius:2px;
}
.tab-btn:hover:not(.active){ color: var(--text); }

@media (max-width:600px){
  .tab-bar{ display:flex; width:100%; }
  .tab-btn{ flex:1; }
}

/* ---------- LOG GRID ---------- */
.grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(228px,1fr));
  gap:10px; margin-bottom: 20px;
}

.card{
  background: var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:12px 13px; position:relative; overflow:hidden;
  transition: transform .15s ease, border-color .15s ease;
}
.card.pulse{ animation: cardPulse .4s ease; }
@keyframes cardPulse{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.015); border-color: var(--coral); }
  100%{ transform:scale(1); }
}

.card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.card-id{ display:flex; align-items:center; gap:7px; min-width:0; }
.card-emoji{ font-size:17px; flex-shrink:0; }
.card-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:13.5px; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-menu-btn{
  background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px;
  padding:0 4px; border-radius:6px; line-height:1; flex-shrink:0;
}
.card-menu-btn:hover{ color:var(--text); background:var(--surface-hi); }

.card-total{ display:flex; align-items:baseline; gap:6px; margin-bottom:2px; }
.card-total .num{
  font-family:'Archivo Black', sans-serif; font-size:24px; color:var(--text);
  transition: transform .18s ease;
}
.card-total .num.bump{ animation: bump .28s ease; }
@keyframes bump{ 0%{transform:scale(1.3); color:var(--coral);} 100%{transform:scale(1); color:var(--text);} }
.card-total .unit{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; }
.card-sub{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-faint); margin-bottom:7px; min-height:13px; }

.tally-strip{ min-height:14px; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:5px; align-items:flex-end; }
.tally-group{ display:flex; gap:2px; align-items:flex-end; }
.tally-mark{
  width:2.5px; height:12px; background: var(--teal); border-radius:1px;
  transform: scaleY(0); transform-origin:bottom; animation: growMark .25s ease forwards;
}
.tally-mark.slash{
  width:13px; height:1.5px; background: var(--coral); margin-left:-11px; margin-bottom:5px;
  transform: scaleX(0) rotate(-35deg); transform-origin:left; animation: growSlash .22s ease forwards;
}
@keyframes growMark{ to{ transform: scaleY(1); } }
@keyframes growSlash{ to{ transform: scaleX(1) rotate(-35deg); } }

.card-actions{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
.preset-btn{
  flex:1; min-width:44px; background: var(--surface-hi); border:1px solid var(--line);
  color:var(--text); font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
  padding:7px 4px; border-radius:7px; cursor:pointer; transition: all .12s ease;
}
.preset-btn:hover{ border-color: var(--coral); color: var(--coral); }
.preset-btn:active{ transform: scale(.94); }

.manual-row{ display:flex; gap:5px; }
.manual-row input{
  width:0; flex:1; background: var(--surface-hi); border:1px solid var(--line); border-radius:7px;
  color:var(--text); padding:7px 8px; font-family:'IBM Plex Mono', monospace; font-size:12px;
}
.manual-row input:focus{ outline:none; border-color: var(--teal); }
.manual-row input::placeholder{ color: var(--text-faint); }
.manual-row button{
  background:none; border:1px dashed var(--text-dim); color:var(--text-dim);
  font-family:'IBM Plex Mono', monospace; font-size:12px; padding:7px 10px; border-radius:7px; cursor:pointer;
  flex-shrink:0;
}
.manual-row button:hover{ border-color: var(--teal); color: var(--teal); border-style:solid; }

.add-card{
  border:1.5px dashed var(--line); background:transparent; display:flex; align-items:center;
  justify-content:center; cursor:pointer; min-height:150px; color:var(--text-faint);
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
}
.add-card:hover{ border-color: var(--teal); color: var(--teal); }

/* ---------- DASHBOARD ---------- */
.dash-card{ background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; width:fit-content; max-width:100%; }
.dash-scroll{ overflow-x:auto; padding-bottom:4px; }
.dash-table{ display:flex; flex-direction:column; gap:8px; }
.dash-row{ display:flex; align-items:center; gap:12px; }
.dash-label{
  flex:0 0 158px; display:flex; align-items:center; gap:7px; min-width:0;
  font-family:'Oswald', sans-serif; font-size:12.5px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dash-label .em{ font-size:14px; flex-shrink:0; }
.dash-cells{ display:flex; gap:2.5px; }
.dash-cell{ width:11px; height:16px; border-radius:2.5px; background: var(--surface-hi); flex-shrink:0; }
.dash-today-marker{ box-shadow: inset 0 0 0 1.5px var(--text); }
.dash-legend{ display:flex; justify-content:flex-end; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-faint); margin-top:14px; }
.legend-cell{ width:11px; height:11px; border-radius:2.5px; }
.dash-axis{ display:flex; align-items:center; gap:12px; font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--text-faint); margin-bottom:6px; }
.dash-axis-cells{ display:flex; justify-content:space-between; flex-shrink:0; }

/* ---------- TOASTS / FX ---------- */
#toast-layer{ position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{
  background: var(--surface-hi); border:1px solid var(--coral); color:var(--text);
  font-family:'Oswald', sans-serif; font-weight:600; font-size:13.5px; letter-spacing:.03em;
  padding:9px 18px; border-radius:999px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  animation: toastIn .35s ease, toastOut .35s ease 2.4s forwards;
}
@keyframes toastIn{ from{ opacity:0; transform: translateY(-10px);} to{opacity:1; transform:translateY(0);} }
@keyframes toastOut{ to{ opacity:0; transform: translateY(-10px);} }

.particle{
  position:fixed; z-index:150; pointer-events:none; border-radius:50%;
  animation: particleFly .6s ease-out forwards;
}
@keyframes particleFly{
  to{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed; inset:0; background: rgba(8,9,11,.72); backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:300; padding:20px;
}
.modal{
  background: var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:22px; width:100%; max-width:380px; max-height:86vh; overflow-y:auto;
}
.modal h3{ font-family:'Oswald', sans-serif; margin:0 0 14px; font-size:17px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px; letter-spacing:.06em;}
.field input{
  width:100%; background: var(--surface-hi); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:9px 11px; font-family:'Inter',sans-serif; font-size:13.5px;
}
.field input:focus{ outline:none; border-color: var(--teal); }
.field-row{ display:flex; gap:9px; }
.field-row .field{ flex:1; }
.checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.checkbox-field input{ width:auto; }
.checkbox-field label{ font-family:'Inter',sans-serif; font-size:13px; color:var(--text); text-transform:none; letter-spacing:0; margin:0; }
.modal-actions{ display:flex; gap:9px; margin-top:14px; }
.btn{
  flex:1; padding:10px; border-radius:9px; border:1px solid var(--line); cursor:pointer;
  font-family:'Oswald', sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.02em; text-transform:uppercase;
}
.btn-primary{ background: var(--coral); border-color: var(--coral); color:#1a0a08; }
.btn-primary:hover{ filter: brightness(1.08); }
.btn-ghost{ background:none; color:var(--text-dim); }
.btn-ghost:hover{ color:var(--text); border-color:var(--text-dim); }
.btn-danger{ background:none; color:var(--coral); border-color: var(--coral-dim); }
.btn-danger:hover{ background: rgba(255,75,62,.1); }

.footer-note{ text-align:center; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; font-size:10px; margin-top:22px; letter-spacing:.02em; }

@media (max-width:600px){
  .wordmark{ font-size:19px; }
  .grid{ grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); }
  .dash-label{ flex-basis:110px; font-size:11px; }
}
</style>
</head>

<script>
(function(){
  const STORAGE_KEY = 'daily-fitness-log-state-v1';

  const DEFAULT_CATEGORIES = [
    { id:'run',        name:'Miles Run',          unit:'mi',     emoji:'🏃', presets:[0.5,1,3],  baseline:614.3 },
    { id:'cycle',      name:'Miles Cycled',       unit:'mi',     emoji:'🚴', presets:[1,5,10],   baseline:4369 },
    { id:'pushups',    name:'Push-ups',           unit:'reps',   emoji:'🫸', presets:[10,20,50], baseline:0 },
    { id:'pullups',    name:'Pull-ups',           unit:'reps',   emoji:'🧗', presets:[5,10,15],  baseline:0 },
    { id:'curls',      name:'Curls',              unit:'reps',   emoji:'💪', presets:[10,15,20], baseline:0 },
    { id:'bench',      name:'Bench Press',        unit:'reps',   emoji:'🏋️', presets:[5,8,10],   baseline:0 },
    { id:'squats',     name:'Kettlebell Squats',  unit:'reps',   emoji:'🦵', presets:[10,25,50], baseline:0 },
    { id:'jumpsquats', name:'Jump Squats',        unit:'reps',   emoji:'🦘', presets:[10,20,30], baseline:0 },
    { id:'jumpingjacks', name:'Jumping Jacks',    unit:'reps',   emoji:'🤸', presets:[20,50,100], baseline:0 },
    { id:'kb',         name:'Kettlebell Swings',  unit:'reps',   emoji:'🔔', presets:[10,20,30], baseline:0 },
    { id:'stairs',     name:'Stairs Climbed',     unit:'floors', emoji:'🪜', presets:[5,10,20],  baseline:3995 },
    { id:'seals',      name:'Burpees',            unit:'reps',   emoji:'💥', presets:[10,15,20], baseline:2500 },
    { id:'p90x',       name:'P90X Reps',          unit:'reps',   emoji:'⚡', presets:[10,20,30], baseline:0 }
  ];
  function freshDefaultState(){
    return { categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)), entries: [] };
  }

  let state = null;
  let activeTab = 'log';
  const app = document.getElementById('app');
  const toastLayer = document.getElementById('toast-layer');
  const DASH_DAYS = 60;

  function todayStr(d){
    d = d || new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dateStrOffset(offsetDays){
    const d = new Date();
    d.setDate(d.getDate()+offsetDays);
    return todayStr(d);
  }
  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

  // Entries store an absolute UTC instant (ts). "Which day" an entry belongs to must
  // always be computed from the LOCAL calendar day, matching todayStr()/dateStrOffset().
  // Do not use e.ts.slice(0,10) anywhere — that reads the UTC date and silently
  // disagrees with local time for anyone not at UTC+0, splitting a single local day's
  // entries across two "days" (this was the pushups-stuck-at-45 bug).
  function dayKeyOf(iso){
    return todayStr(new Date(iso));
  }

  function readSeedData(){
    try{
      const el = document.getElementById('seed-data');
      if(!el) return null;
      const txt = el.textContent.trim();
      if(!txt) return null;
      const parsed = JSON.parse(txt);
      if(!Array.isArray(parsed.categories) || !Array.isArray(parsed.entries)) return null;
      return parsed;
    }catch(e){ return null; }
  }

  // Combines two entry lists into one, deduped by id. Entries are only ever appended,
  // never edited in place, so a given id always carries the same data on both sides —
  // this just guarantees nothing logged on either side is ever silently dropped.
  function mergeEntriesById(a, b){
    const map = new Map();
    (a||[]).forEach(e=> map.set(e.id, e));
    (b||[]).forEach(e=> map.set(e.id, e));
    return Array.from(map.values());
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const localState = raw ? JSON.parse(raw) : null;
      const seed = readSeedData();

      if(localState && seed){
        // Reconcile by recency, not by source: whichever copy was saved more recently wins —
        // this decides which CATEGORY METADATA (names, presets, baselines) to trust, since
        // those can legitimately be edited on either side and we don't want a stale copy's
        // edits to clobber newer ones.
        // This is what actually caused the "progress wiped" bug — the old code always
        // trusted local storage over the file's embedded data, even when the file was newer.
        const localTime = Date.parse(localState.savedAt || 0) || 0;
        const seedTime = Date.parse(seed.savedAt || 0) || 0;
        state = seedTime >= localTime ? seed : localState;
        // But logged ENTRIES are append-only and never conflict with each other (each has a
        // unique id), so — regardless of which side "wins" above for category metadata —
        // union the entries from both sources. Otherwise, whichever side has an older
        // savedAt loses every entry logged after that snapshot, even if that copy is the one
        // the user has actually been logging into (e.g. after redeploying an updated file
        // over a browser that kept using the previously-deployed page in the meantime).
        state.entries = mergeEntriesById(seed.entries, localState.entries);
      } else if(seed){
        state = seed;
      } else if(localState){
        state = localState;
      } else {
        state = freshDefaultState();
      }

      if(!Array.isArray(state.categories)) state.categories = freshDefaultState().categories;
      if(!Array.isArray(state.entries)) state.entries = [];
      migrateState();
    }catch(e){
      console.error('load failed, starting fresh', e);
      state = freshDefaultState();
    }
  }

  // brings a loaded state up to date with the current default category set,
  // without touching any logged entries
  function migrateState(){
    const KNOWN_BASELINES = { run:614.3, cycle:4369, stairs:3995, seals:2500 };
    const DEFAULT_EMOJI = {};
    DEFAULT_CATEGORIES.forEach(c=>{ DEFAULT_EMOJI[c.id] = c.emoji; });
    state.categories.forEach(c=>{
      if(DEFAULT_EMOJI.hasOwnProperty(c.id)) c.emoji = DEFAULT_EMOJI[c.id];
      if(typeof c.baseline !== 'number'){
        c.baseline = KNOWN_BASELINES.hasOwnProperty(c.id) ? KNOWN_BASELINES[c.id] : 0;
      } else if(c.baseline === 0 && KNOWN_BASELINES.hasOwnProperty(c.id) && !c._baselineConfirmed){
        c.baseline = KNOWN_BASELINES[c.id];
      }
      c._baselineConfirmed = true;
      if(c.id==='squats' && (c.name==='Air Squats' || c.name==='Bodyweight Squats')) c.name = 'Kettlebell Squats';
      if(c.id==='seals' && c.name==='Navy SEALs') c.name = 'Burpees';
      if(c.id==='bench' && c.name==='Bench') c.name = 'Bench Press';
    });
    if(!state.categories.find(c=>c.id==='jumpsquats')){
      state.categories.push({ id:'jumpsquats', name:'Jump Squats', unit:'reps', emoji:'🦘', presets:[10,20,30], baseline:0, _baselineConfirmed:true });
    }
    if(!state.categories.find(c=>c.id==='jumpingjacks')){
      state.categories.push({ id:'jumpingjacks', name:'Jumping Jacks', unit:'reps', emoji:'🤸', presets:[20,50,100], baseline:0, _baselineConfirmed:true });
    }
    saveState();
  }

  function saveState(){
    try{
      state.savedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('save failed', e);
      showToast('⚠ could not save — storage may be full or blocked');
    }
  }

  // ---------- derived stats ----------
  function entriesForDay(dateStr){
    return state.entries.filter(e=> dayKeyOf(e.ts)===dateStr );
  }
  function todayTotalFor(catId){
    return entriesForDay(todayStr()).filter(e=>e.categoryId===catId).reduce((s,e)=>s+e.amount,0);
  }
  function todayLogCountFor(catId){
    return entriesForDay(todayStr()).filter(e=>e.categoryId===catId).length;
  }
  function catDayTotal(catId, dateStr){
    return state.entries.filter(e=>e.categoryId===catId && dayKeyOf(e.ts)===dateStr)
      .reduce((s,e)=>s+e.amount,0);
  }
  function allTimeTotal(cat){
    const logged = state.entries.filter(e=>e.categoryId===cat.id).reduce((s,e)=>s+e.amount,0);
    return (cat.baseline||0) + logged;
  }
  // single source of truth for the card sub-line — used on initial render and on
  // every log so the two can't drift out of sync with each other
  function buildSubLine(cat){
    const allTime = allTimeTotal(cat);
    return `all-time: ${formatAmount(allTime)} ${cat.unit}`;
  }

  function formatAmount(n){
    return (Math.round(n*100)/100).toString();
  }

  // ---------- rendering ----------

  function render(){
    app.innerHTML = `
      <div class="header">
        <div>
          <div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}</div>
          <div class="wordmark">Daily Fitness Log</div>
        </div>
        <div class="header-right">
          <button class="io-btn" id="saveBtn" title="Save your data into a file you can carry to another computer">Save</button>
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn ${activeTab==='log'?'active':''}" data-tab="log">Log</button>
        <button class="tab-btn ${activeTab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button>
      </div>

      <div id="tabContent"></div>
    `;

    document.getElementById('saveBtn').addEventListener('click', saveToFile);
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
    });

    if(activeTab==='log') renderLogTab();
    else renderDashboardTab();
  }

  function renderLogTab(){
    const content = document.getElementById('tabContent');
    content.innerHTML = `<div class="grid" id="cardGrid"></div>`;
    renderCards();
  }

  function renderCards(){
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    state.categories.forEach(cat=>{
      const total = todayTotalFor(cat.id);
      const logCount = todayLogCountFor(cat.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-'+cat.id;

      const tallyHTML = renderTally(logCount);
      const subLine = buildSubLine(cat);

      card.innerHTML = `
        <div class="card-top">
          <div class="card-id">
            <span class="card-emoji">${cat.emoji}</span>
            <span class="card-name">${escapeHtml(cat.name)}</span>
          </div>
          <button class="card-menu-btn" data-menu="${cat.id}">⋯</button>
        </div>
        <div class="card-total">
          <span class="num" id="num-${cat.id}">${formatAmount(total)}</span>
          <span class="unit">${escapeHtml(cat.unit)}</span>
        </div>
        <div class="card-sub">${subLine}</div>
        <div class="tally-strip" id="tally-${cat.id}">${tallyHTML}</div>
        <div class="card-actions">
          ${cat.presets.map(p=>`<button class="preset-btn" data-cat="${cat.id}" data-amt="${p}">+${formatAmount(p)}</button>`).join('')}
        </div>
        <div class="manual-row">
          <input type="number" step="0.1" min="0" inputmode="decimal" placeholder="amount" id="manual-amt-${cat.id}">
          <button data-log="${cat.id}">Log</button>
        </div>
      `;
      grid.appendChild(card);
    });

    const addCard = document.createElement('div');
    addCard.className = 'card add-card';
    addCard.textContent = '+ add category';
    addCard.addEventListener('click', openAddCategoryModal);
    grid.appendChild(addCard);

    grid.querySelectorAll('.preset-btn').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        const catId = btn.dataset.cat;
        logEntry(catId, parseFloat(btn.dataset.amt), ev);
      });
    });
    grid.querySelectorAll('[data-log]').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        const catId = btn.dataset.log;
        const amtInput = document.getElementById('manual-amt-'+catId);
        const amt = parseFloat(amtInput.value);
        if(isNaN(amt) || amt<=0){ amtInput.style.borderColor='var(--coral)'; return; }
        logEntry(catId, amt, ev);
        amtInput.value=''; amtInput.style.borderColor='';
      });
    });
    grid.querySelectorAll('[data-menu]').forEach(btn=>{
      btn.addEventListener('click', ()=> openCategoryMenu(btn.dataset.menu));
    });
    grid.querySelectorAll('.manual-row input').forEach(inp=>{
      inp.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          const row = inp.closest('.manual-row');
          row.querySelector('button').click();
        }
      });
    });
  }

  function renderTally(count){
    let html = '';
    const fullGroups = Math.floor(count/5);
    const remainder = count % 5;
    for(let g=0; g<fullGroups; g++){
      html += '<div class="tally-group">'+
        [0,1,2,3].map(()=>`<div class="tally-mark"></div>`).join('') +
        `<div class="tally-mark slash"></div>` +
      '</div>';
    }
    if(remainder>0){
      html += '<div class="tally-group">'+
        Array.from({length:remainder}).map(()=>`<div class="tally-mark"></div>`).join('') +
      '</div>';
    }
    return html;
  }

  function renderDashboardTab(){
    const content = document.getElementById('tabContent');

    // per-category max day total, for relative shading within that category's own row
    const maxByCat = {};
    state.categories.forEach(cat=>{
      let max = 0;
      for(let i=0;i<DASH_DAYS;i++){
        const v = catDayTotal(cat.id, dateStrOffset(-i));
        if(v>max) max = v;
      }
      maxByCat[cat.id] = max;
    });

    const rowsHTML = state.categories.map(cat=>{
      const cellsHTML = [];
      for(let i=0;i<DASH_DAYS;i++){
        const ds = dateStrOffset(-i);
        const v = catDayTotal(cat.id, ds);
        const max = maxByCat[cat.id];
        let bg = 'var(--surface-hi)';
        if(max>0 && v>0){
          const ratio = v/max;
          if(ratio<=0.33) bg = '#1f4a44';
          else if(ratio<=0.66) bg = '#1f8a7a';
          else bg = 'var(--teal)';
        }
        const isToday = i===0;
        const label = `${cat.name} — ${ds}: ${formatAmount(v)} ${cat.unit}`;
        cellsHTML.push(`<div class="dash-cell${isToday?' dash-today-marker':''}" style="background:${bg}" title="${escapeHtml(label)}"></div>`);
      }
      return `
        <div class="dash-row">
          <div class="dash-label"><span class="em">${cat.emoji}</span><span>${escapeHtml(cat.name)}</span></div>
          <div class="dash-cells">${cellsHTML.join('')}</div>
        </div>
      `;
    }).join('');

    // matches the pixel math of .dash-cell (width 11px) + .dash-cells gap (2.5px),
    // so the axis labels line up with the first/last cell regardless of screen width
    const axisCellsWidth = DASH_DAYS*11 + (DASH_DAYS-1)*2.5;

    content.innerHTML = `
      <div class="dash-card">
        <div class="dash-scroll">
          <div class="dash-axis">
            <div class="dash-label" style="visibility:hidden;" aria-hidden="true"></div>
            <div class="dash-axis-cells" style="width:${axisCellsWidth}px;">
              <span>today</span><span>${DASH_DAYS} days ago</span>
            </div>
          </div>
          <div class="dash-table">${rowsHTML}</div>
        </div>
        <div class="dash-legend">
          <span>less</span>
          <span class="legend-cell" style="background:var(--surface-hi)"></span>
          <span class="legend-cell" style="background:#1f4a44"></span>
          <span class="legend-cell" style="background:#1f8a7a"></span>
          <span class="legend-cell" style="background:var(--teal)"></span>
          <span>more</span>
        </div>
        <div style="margin-top:16px;"><button class="io-btn" id="csvBtn">Export CSV</button></div>
      </div>
    `;
    document.getElementById('csvBtn').addEventListener('click', exportCSV);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- actions ----------
  function logEntry(catId, amount, ev){
    const cat = state.categories.find(c=>c.id===catId);
    if(!cat) return;
    const entry = { id: uid(), categoryId: catId, amount, ts: new Date().toISOString() };
    state.entries.push(entry);

    const numEl = document.getElementById('num-'+catId);
    if(numEl){
      numEl.textContent = formatAmount(todayTotalFor(catId));
      numEl.classList.remove('bump'); void numEl.offsetWidth; numEl.classList.add('bump');
    }
    const cardEl = document.getElementById('card-'+catId);
    if(cardEl){
      const subEl = cardEl.querySelector('.card-sub');
      if(subEl){
        subEl.textContent = buildSubLine(cat);
      }
      cardEl.classList.remove('pulse'); void cardEl.offsetWidth; cardEl.classList.add('pulse');
    }
    const tallyEl = document.getElementById('tally-'+catId);
    if(tallyEl) tallyEl.innerHTML = renderTally(todayLogCountFor(catId));

    if(ev && ev.clientX) spawnParticles(ev.clientX, ev.clientY);

    saveState();
  }

  function spawnParticles(x,y){
    const colors = ['#ff4b3e','#ffb648','#34c9c0'];
    for(let i=0;i<10;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4+Math.random()*5;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = x+'px';
      p.style.top = y+'px';
      p.style.background = colors[i%colors.length];
      const angle = Math.random()*Math.PI*2;
      const dist = 40+Math.random()*60;
      p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 650);
    }
  }

  function showToast(msg, durationMs){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    toastLayer.appendChild(t);
    setTimeout(()=>t.remove(), durationMs || 2700);
  }

  // Delivers a file to the user as a normal browser download.
  function deliverFile(filename, mimeType, contents){
    try{
      const blob = new Blob([contents], {type: mimeType});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return true;
    }catch(e){
      console.error('download failed', e);
      showToast('⚠ save failed');
      return false;
    }
  }

  function exportCSV(){
    try{
      const rows = [['date','time','category','amount','unit']];
      const sorted = [...state.entries].sort((a,b)=> a.ts.localeCompare(b.ts));
      sorted.forEach(e=>{
        const cat = state.categories.find(c=>c.id===e.categoryId);
        const d = new Date(e.ts);
        const dateStr = dayKeyOf(e.ts);
        const timeStr = d.toTimeString().slice(0,8);
        rows.push([
          dateStr,
          timeStr,
          cat ? cat.name : e.categoryId,
          e.amount,
          cat ? cat.unit : ''
        ]);
      });
      const csv = rows.map(r=> r.map(cell=>{
        const s = String(cell);
        return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
      }).join(',')).join('\n');
      if(deliverFile('fitness-log-history-'+todayStr()+'.csv', 'text/csv', csv)){
        showToast('⬇ full history exported as CSV');
      }
    }catch(e){
      console.error('csv export failed', e);
      showToast('⚠ CSV export failed');
    }
  }

  // ---------- save-to-file (single button, no import step) ----------
  function saveToFile(){
    try{
      state.savedAt = new Date().toISOString();
      saveState();
      const docClone = document.documentElement.cloneNode(true);
      const seedEl = docClone.querySelector('#seed-data');
      if(seedEl) seedEl.textContent = JSON.stringify(state);
      const htmlStr = '<!DOCTYPE html>\n' + docClone.outerHTML;
      if(deliverFile('fitness-log.html', 'text/html', htmlStr)){
        showToast('✓ saved — replace your old copy with this to carry it anywhere');
      }
    }catch(e){
      console.error('save failed', e);
      showToast('⚠ save failed');
    }
  }

  // ---------- modals ----------
  function openModal(innerHTML){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<div class="modal">${innerHTML}</div>`;
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
    document.body.appendChild(backdrop);
    return backdrop;
  }

  function openAddCategoryModal(){
    const backdrop = openModal(`
      <h3>New Category</h3>
      <div class="field-row">
        <div class="field" style="flex:0 0 64px;">
          <label>Icon</label>
          <input type="text" id="newEmoji" maxlength="2" value="🏋️" placeholder="🏋️">
        </div>
        <div class="field">
          <label>Name</label>
          <input type="text" id="newName" placeholder="e.g. Burpees">
        </div>
      </div>
      <div class="field">
        <label>Unit</label>
        <input type="text" id="newUnit" placeholder="reps / mi / floors">
      </div>
      <div class="field">
        <label>Quick-add amounts (comma separated, decimals ok)</label>
        <input type="text" id="newPresets" placeholder="10, 20, 50">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="confirmAdd">Create</button>
      </div>
    `);
    backdrop.querySelector('#newName').focus();
    backdrop.querySelector('#cancelAdd').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelector('#confirmAdd').addEventListener('click', ()=>{
      const name = backdrop.querySelector('#newName').value.trim();
      const unit = backdrop.querySelector('#newUnit').value.trim() || 'count';
      const emoji = backdrop.querySelector('#newEmoji').value.trim() || '⭐';
      const presetsRaw = backdrop.querySelector('#newPresets').value.trim();
      let presets = presetsRaw.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n) && n>0);
      if(presets.length===0) presets = [1,5,10];
      if(!name) { backdrop.querySelector('#newName').style.borderColor='var(--coral)'; return; }
      state.categories.push({ id: uid(), name, unit, emoji, presets: presets.slice(0,4), baseline:0, _baselineConfirmed:true });
      saveState();
      backdrop.remove();
      render();
    });
  }

  function openCategoryMenu(catId){
    const cat = state.categories.find(c=>c.id===catId);
    const lastEntry = [...state.entries].reverse().find(e=>e.categoryId===catId);
    const backdrop = openModal(`
      <h3>${escapeHtml(cat.emoji)} ${escapeHtml(cat.name)}</h3>
      <div class="field">
        <label>Rename</label>
        <input type="text" id="editName" value="${escapeHtml(cat.name)}">
      </div>
      <div class="field">
        <label>Quick-add amounts</label>
        <input type="text" id="editPresets" value="${cat.presets.join(', ')}">
      </div>
      <div class="field">
        <label>Lifetime baseline (effort before this app — not counted in history)</label>
        <input type="number" step="any" id="editBaseline" value="${cat.baseline||0}">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="closeMenu">Close</button>
        <button class="btn btn-primary" id="saveEdits">Save</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="undoLast" ${lastEntry?'':'disabled'}>Undo last entry</button>
        <button class="btn btn-danger" id="deleteCat">Delete category</button>
      </div>
    `);
    backdrop.querySelector('#closeMenu').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelector('#saveEdits').addEventListener('click', ()=>{
      const newName = backdrop.querySelector('#editName').value.trim();
      const presetsRaw = backdrop.querySelector('#editPresets').value.trim();
      const baselineVal = parseFloat(backdrop.querySelector('#editBaseline').value);
      let presets = presetsRaw.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n) && n>0);
      if(newName) cat.name = newName;
      if(presets.length>0) cat.presets = presets.slice(0,4);
      cat.baseline = isNaN(baselineVal) ? 0 : baselineVal;
      cat._baselineConfirmed = true;
      saveState();
      backdrop.remove();
      render();
    });
    backdrop.querySelector('#undoLast').addEventListener('click', ()=>{
      if(lastEntry){
        state.entries = state.entries.filter(e=>e.id!==lastEntry.id);
        saveState();
        render();
      }
      backdrop.remove();
    });
    backdrop.querySelector('#deleteCat').addEventListener('click', ()=>{
      state.categories = state.categories.filter(c=>c.id!==catId);
      state.entries = state.entries.filter(e=>e.categoryId!==catId);
      saveState();
      backdrop.remove();
      render();
    });
  }

  // ---------- init ----------
  loadState();
  render();

})();
</script>


</body></html>
